                <button onclick="resetAllCameras()" class="px-2.5 py-1 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 text-[11px] font-medium transition">
                    ↺ Reset View
                </button>
                <button onclick="downloadStandaloneHTML()" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-semibold flex items-center gap-1 shadow-sm transition">
                    ⬇ Download .HTML for PPT
                </button>
            </div>
        </div>

        <!-- ======================================================================= -->
        <!-- PANEL 1 (TOP RECTANGLE): 1. MALUS'S LAW (TWO POLARISERS)                -->
        <!-- ======================================================================= -->
        <div class="ppt-panel rounded-lg p-2.5 flex flex-col gap-1.5">
            <!-- Compact Top Control & Legend Bar -->
            <div class="flex flex-wrap items-center justify-between gap-2 px-1 text-xs">
                <div class="flex items-center gap-2">
                    <span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200 text-[11px] font-bold">1</span>
                    <span class="font-bold text-slate-800">Malus's Law (Two Polarisers)</span>
                    <span class="hidden lg:inline text-slate-400 font-normal ml-1">
                        <span class="math-serif">E</span> = <span class="math-serif">E</span>₀ cos<span class="math-serif">α</span>
                    </span>
                </div>

                <!-- Controls in Header -->
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-[11px] font-medium text-slate-600">Analyser <span class="math-serif">α</span>:</span>
                    <input id="sliderAlpha" type="range" min="0" max="360" step="1" value="30" class="w-28 sm:w-36" oninput="updateMalusAlpha(this.value)">
                    <div class="flex items-center gap-1 text-[11px]">
                        <button onclick="updateMalusAlpha(0)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">0°</button>
                        <button onclick="updateMalusAlpha(45)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">45°</button>
                        <button onclick="updateMalusAlpha(90)" class="px-1.5 py-0.5 rounded bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-medium">90°</button>
                        <button id="btnAutoMalus" onclick="toggleAutoMalus()" class="px-2 py-0.5 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-medium">Auto 360°</button>
                    </div>
                </div>

                <!-- Live Readout -->
                <div class="flex items-center gap-2.5 text-[11px] bg-slate-50 px-2.5 py-0.5 rounded border border-slate-200">
                    <span><span class="math-serif font-bold">α</span> = <strong id="malusAlphaLabel" class="mono text-rose-600">30°</strong></span>
                    <span class="text-slate-300">|</span>
                    <span>cos²<span class="math-serif">α</span> = <strong id="malusIntLabel" class="mono text-indigo-600">0.75</strong></span>
                    <span class="text-slate-300">|</span>
                    <span><span class="math-serif">P</span> = <strong id="malusPowerLabel" class="mono text-slate-800">30.7 mW</strong></span>
                </div>
            </div>

            <!-- Wide Rectangular White 3D Canvas -->
            <div class="relative w-full h-[220px] sm:h-[240px] bg-white rounded overflow-hidden">
                <canvas id="canvasMalus" class="w-full h-full block cursor-grab active:cursor-grabbing" width="1756" height="480"></canvas>
                <!-- Minimalist Legend Bottom-Left -->
                <div class="absolute bottom-1.5 left-2.5 flex items-center gap-4 text-[11px] text-slate-500 pointer-events-none bg-white/80 px-2 py-0.5 rounded">
                    <span class="flex items-center gap-1"><i class="w-2.5 h-0.5 bg-amber-500 inline-block"></i> Unpolarised</span>
                    <span class="flex items-center gap-1"><i class="w-2.5 h-0.5 bg-rose-600 inline-block"></i> Linearly Polarised (<span class="math-serif">E</span>₀)</span>
                    <span class="flex items-center gap-1"><i class="w-2.5 h-0.5 bg-indigo-600 inline-block"></i> Transmitted (<span class="math-serif">E</span>₀ cos<span class="math-serif">α</span>)</span>
                </div>
            </div>
        </div>

        <!-- ======================================================================= -->
        <!-- PANEL 2 (BOTTOM RECTANGLE): 2. QUARTER-WAVE PLATE (Δφ = π/2)            -->
        <!-- ======================================================================= -->
        <div class="ppt-panel rounded-lg p-2.5 flex flex-col gap-1.5">
            <!-- Compact Top Control & Legend Bar -->
            <div class="flex flex-wrap items-center justify-between gap-2 px-1 text-xs">
                <div class="flex items-center gap-2">
                    <span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-200 text-[11px] font-bold">2</span>
                    <span class="font-bold text-slate-800">Quarter-Wave Plate (<span class="math-serif">λ</span>/4, Δ<span class="math-serif">φ</span> = <span class="math-serif">π</span>/2)</span>
                </div>

                <!-- Angle Presets & Slider -->
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-[11px] font-medium text-slate-600">QWP <span class="math-serif">θ</span>:</span>
                    <input id="sliderTheta" type="range" min="0" max="90" step="1" value="45" class="w-24 sm:w-32" oninput="updateQWPTheta(this.value)">
                    <div class="flex items-center gap-1 text-[11px]">
                        <button onclick="updateQWPTheta(0)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">0°</button>
                        <button onclick="updateQWPTheta(15)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">15°</button>
                        <button onclick="updateQWPTheta(30)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">30°</button>
                        <button onclick="updateQWPTheta(45)" class="px-1.5 py-0.5 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold">45°</button>
                        <button onclick="updateQWPTheta(60)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">60°</button>
                        <button onclick="updateQWPTheta(75)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">75°</button>
                        <button onclick="updateQWPTheta(90)" class="px-1.5 py-0.5 rounded bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200">90°</button>
                    </div>
                </div>

                <!-- Live State & Power Readout -->
                <div class="flex items-center gap-2.5 text-[11px] bg-slate-50 px-2.5 py-0.5 rounded border border-slate-200">
                    <span><span class="math-serif font-bold">θ</span> = <strong id="qwpThetaLabel" class="mono text-blue-600">45°</strong></span>
                    <span class="text-slate-300">|</span>
                    <strong id="qwpStateText" class="text-indigo-600 font-bold">Circular</strong>
                    <span class="text-slate-300">|</span>
                    <span><span class="math-serif">P</span> = <strong id="qwpPowerLabel" class="mono text-emerald-700">11.35 mW</strong></span>
                </div>
            </div>

            <!-- Wide Rectangular White 3D Canvas -->
            <div class="relative w-full h-[225px] sm:h-[245px] bg-white rounded overflow-hidden">
                <canvas id="canvasQWP" class="w-full h-full block cursor-grab active:cursor-grabbing" width="1756" height="490"></canvas>

                <!-- Minimalist Layer Toggles Bottom-Left -->
                <div class="absolute bottom-1.5 left-2.5 flex flex-wrap items-center gap-3 text-[11px] text-slate-600 bg-white/90 px-2 py-0.5 rounded border border-slate-100">
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" id="chkShowComponents" checked="" onchange="toggleQWPDisplay()" class="rounded text-blue-600">
                        <span><strong class="text-blue-600"><span class="math-serif">E</span>_e</strong> &amp; <strong class="text-rose-600"><span class="math-serif">E</span>_o</strong></span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" id="chkShowTotalE" checked="" onchange="toggleQWPDisplay()" class="rounded text-indigo-600">
                        <span><strong class="text-indigo-600">Total <span class="math-serif">E</span></strong></span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" id="chkShowP2" checked="" onchange="toggleQWPDisplay()" class="rounded text-emerald-600">
                        <span><strong class="text-emerald-600">Analyser P2</strong></span>
                    </label>
                </div>
            </div>
        </div>

    </div>

    <script>
        // =========================================================================
        // 1. STATE & PARAMETERS (Scaled-down 3D View with Wide Spacing)
        // =========================================================================
        let isPlaying = true;
        let phase = 0;
        let autoMalus = false;

        // Panel 1: Malus's Law
        let alphaDeg = 30;
        let cam1 = { yaw: -0.48, pitch: 0.24, zoom: 0.68 };

        // Panel 2: Quarter-Wave Plate (with large gap between State Plane and P2)
        let thetaDeg = 45;
        let showComponents = true;
        let showTotalE = true;
        let showP2 = true;
        let cam2 = { yaw: -0.48, pitch: 0.24, zoom: 0.68 };

        // =========================================================================
        // 2. UI CONTROLS & ONE-CLICK DOWNLOAD
        // =========================================================================
        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('iconPlay').textContent = isPlaying ? '⏸' : '▶';
            document.getElementById('textPlay').textContent = isPlaying ? 'Pause' : 'Play';
        }

        function resetAllCameras() {
            cam1 = { yaw: -0.48, pitch: 0.24, zoom: 0.68 };
            cam2 = { yaw: -0.48, pitch: 0.24, zoom: 0.68 };
        }

        function toggleAutoMalus() {
            autoMalus = !autoMalus;
            const btn = document.getElementById('btnAutoMalus');
            if (autoMalus) {
                btn.className = 'px-2 py-0.5 rounded bg-indigo-600 text-white border border-indigo-600 font-medium';
            } else {
                btn.className = 'px-2 py-0.5 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-medium';
            }
        }

        function updateMalusAlpha(val) {
            alphaDeg = parseFloat(val) % 360;
            if (alphaDeg < 0) alphaDeg += 360;
            document.getElementById('sliderAlpha').value = Math.round(alphaDeg);
            document.getElementById('malusAlphaLabel').textContent = `${Math.round(alphaDeg)}°`;

            const rad = alphaDeg * Math.PI / 180;
            const cos2A = Math.pow(Math.cos(rad), 2);
            // Fitted equation from report Eq (4): P = 41.84 * cos^2(alpha) - 0.69 mW
            const pFit = Math.max(0, 41.84 * cos2A - 0.69);

            document.getElementById('malusIntLabel').textContent = cos2A.toFixed(2);
            document.getElementById('malusPowerLabel').textContent = `${pFit.toFixed(1)} mW`;
        }

        function updateQWPTheta(val) {
            thetaDeg = parseFloat(val);
            document.getElementById('sliderTheta').value = Math.round(thetaDeg);
            document.getElementById('qwpThetaLabel').textContent = `${Math.round(thetaDeg)}°`;

            const thRound = Math.round(thetaDeg);
            const stateEl = document.getElementById('qwpStateText');
            if (thRound === 0 || thRound === 90) {
                stateEl.textContent = 'Linear';
                stateEl.className = 'text-slate-700 font-semibold';
            } else if (thRound === 45) {
                stateEl.textContent = 'Circular';
                stateEl.className = 'text-indigo-600 font-bold';
            } else {
                stateEl.textContent = 'Elliptical';
                stateEl.className = 'text-blue-600 font-semibold';
            }

            // Fitted equation from report Eq (5): P = 11.19 * sin^2(2*theta) + 0.16 mW
            const sin2Val = Math.pow(Math.sin(2 * thetaDeg * Math.PI / 180), 2);
            const pQWP = 11.19 * sin2Val + 0.16;
            document.getElementById('qwpPowerLabel').textContent = `${pQWP.toFixed(2)} mW`;
        }

        function toggleQWPDisplay() {
            showComponents = document.getElementById('chkShowComponents').checked;
            showTotalE = document.getElementById('chkShowTotalE').checked;
            showP2 = document.getElementById('chkShowP2').checked;
        }

        function downloadStandaloneHTML() {
            const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'polarization_simulation.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // =========================================================================
        // 3. 3D PROJECTION & DRAWING PRIMITIVES
        // =========================================================================
        function projectPoint(x, y, z, w, h, cam) {
            const wx = z;
            const wy = y;
            const wz = x;

            const x1 = wx * Math.cos(cam.yaw) + wz * Math.sin(cam.yaw);
            const z1 = -wx * Math.sin(cam.yaw) + wz * Math.cos(cam.yaw);

            const y2 = wy * Math.cos(cam.pitch) - z1 * Math.sin(cam.pitch);
            const z2 = wy * Math.sin(cam.pitch) + z1 * Math.cos(cam.pitch);

            const fov = 1500;
            const s = (Math.min(w, h * 3.5) / 540) * cam.zoom * (fov / (fov + z2));

            return {
                u: w * 0.5 + x1 * s,
                v: h * 0.53 - y2 * s
            };
        }

        function drawReferencePlane(ctx, zPos, halfSize, w, h, cam, titleText, subText = '', borderColor = '#94a3b8', fillColor = 'rgba(241, 245, 249, 0.52)') {
            const c1 = projectPoint(-halfSize, -halfSize, zPos, w, h, cam);
            const c2 = projectPoint(halfSize, -halfSize, zPos, w, h, cam);
            const c3 = projectPoint(halfSize, halfSize, zPos, w, h, cam);
            const c4 = projectPoint(-halfSize, halfSize, zPos, w, h, cam);

            ctx.beginPath();
            ctx.moveTo(c1.u, c1.v);
            ctx.lineTo(c2.u, c2.v);
            ctx.lineTo(c3.u, c3.v);
            ctx.lineTo(c4.u, c4.v);
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1;
            ctx.stroke();

            const xA = projectPoint(-halfSize, 0, zPos, w, h, cam);
            const xB = projectPoint(halfSize, 0, zPos, w, h, cam);
            const yA = projectPoint(0, -halfSize, zPos, w, h, cam);
            const yB = projectPoint(0, halfSize, zPos, w, h, cam);

            ctx.beginPath();
            ctx.moveTo(xA.u, xA.v); ctx.lineTo(xB.u, xB.v);
            ctx.moveTo(yA.u, yA.v); ctx.lineTo(yB.u, yB.v);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            if (titleText) {
                const topPt = projectPoint(0, halfSize * 1.24, zPos, w, h, cam);
                ctx.fillStyle = '#334155';
                ctx.font = '600 11px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(titleText, topPt.u, topPt.v);
            }
            if (subText) {
                const botPt = projectPoint(0, -halfSize * 1.28, zPos, w, h, cam);
                ctx.fillStyle = '#64748b';
                ctx.font = '500 10.5px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(subText, botPt.u, botPt.v);
            }
        }

        function drawOpticalElementDisk(ctx, zPos, radius, axisAngleDeg, titleText, subText, axisColor, showOrthogonalAxis, w, h, cam) {
            drawReferencePlane(ctx, zPos, radius * 1.05, w, h, cam, '', '', '#e2e8f0', 'rgba(248, 250, 252, 0.35)');

            const segs = 48;
            ctx.beginPath();
            for (let i = 0; i <= segs; i++) {
                const ang = (i / segs) * Math.PI * 2;
                const px = radius * Math.sin(ang);
                const py = radius * Math.cos(ang);
                const pt = projectPoint(px, py, zPos, w, h, cam);
                if (i === 0) ctx.moveTo(pt.u, pt.v);
                else ctx.lineTo(pt.u, pt.v);
            }
            ctx.fillStyle = 'rgba(226, 232, 240, 0.32)';
            ctx.fill();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.4;
            ctx.stroke();

            const rad = axisAngleDeg * Math.PI / 180;

            if (showOrthogonalAxis) {
                const ox = radius * 0.94 * Math.cos(rad);
                const oy = -radius * 0.94 * Math.sin(rad);
                const pO1 = projectPoint(-ox, -oy, zPos, w, h, cam);
                const pO2 = projectPoint(ox, oy, zPos, w, h, cam);
                ctx.beginPath();
                ctx.setLineDash([3, 3]);
                ctx.moveTo(pO1.u, pO1.v);
                ctx.lineTo(pO2.u, pO2.v);
                ctx.strokeStyle = '#e11d48';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            const ax = radius * 0.95 * Math.sin(rad);
            const ay = radius * 0.95 * Math.cos(rad);
            const p1 = projectPoint(-ax, -ay, zPos, w, h, cam);
            const p2 = projectPoint(ax, ay, zPos, w, h, cam);

            ctx.beginPath();
            ctx.moveTo(p1.u, p1.v);
            ctx.lineTo(p2.u, p2.v);
            ctx.strokeStyle = axisColor;
            ctx.lineWidth = 2.4;
            ctx.stroke();

            const topPt = projectPoint(0, radius * 1.3, zPos, w, h, cam);
            ctx.fillStyle = '#1e293b';
            ctx.font = '600 11px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(titleText, topPt.u, topPt.v);

            if (subText) {
                const botPt = projectPoint(0, -radius * 1.32, zPos, w, h, cam);
                ctx.fillStyle = axisColor;
                ctx.font = '600 10.5px "JetBrains Mono", monospace';
                ctx.fillText(subText, botPt.u, botPt.v);
            }
        }

        function drawCombWave3D(ctx, zStart, zEnd, evalFunc, strokeColor, combColor, w, h, cam, lineWidth = 2.1, combStep = 10) {
            ctx.beginPath();
            for (let z = zStart; z <= zEnd; z += combStep) {
                const { ex, ey } = evalFunc(z);
                const pBase = projectPoint(0, 0, z, w, h, cam);
                const pTip = projectPoint(ex, ey, z, w, h, cam);
                ctx.moveTo(pBase.u, pBase.v);
                ctx.lineTo(pTip.u, pTip.v);
            }
            ctx.strokeStyle = combColor;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            for (let z = zStart; z <= zEnd; z += 3) {
                const { ex, ey } = evalFunc(z);
                const pt = projectPoint(ex, ey, z, w, h, cam);
                if (z === zStart) ctx.moveTo(pt.u, pt.v);
                else ctx.lineTo(pt.u, pt.v);
            }
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        function drawArrow2D(ctx, x1, y1, x2, y2, color, lw = 2.0) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len < 2) return;
            const angle = Math.atan2(dy, dx);
            const headLen = Math.min(7.5, len * 0.35);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = lw;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        // =========================================================================
        // 4. RENDER PANEL 1: MALUS'S LAW (TWO POLARISERS)
        // =========================================================================
        function renderMalusWithSize(ctx, w, h) {
            const zStart = -420;
            const zP1 = -230;
            const zP2 = 55;
            const zEnd = 360;
            const R = 64;
            const k = 0.052;

            // Propagation axis z
            const pAxisStart = projectPoint(0, 0, zStart - 20, w, h, cam1);
            const pAxisEnd = projectPoint(0, 0, zEnd + 35, w, h, cam1);
            drawArrow2D(ctx, pAxisStart.u, pAxisStart.v, pAxisEnd.u, pAxisEnd.v, '#64748b', 1.3);
            ctx.fillStyle = '#475569';
            ctx.font = 'italic bold 12px "Times New Roman", serif';
            ctx.fillText('z', pAxisEnd.u + 10, pAxisEnd.v + 4);

            // Unpolarised wave before P1
            [0, 60, 120].forEach((ang, idx) => {
                const rad = ang * Math.PI / 180;
                drawCombWave3D(
                    ctx, zStart, zP1,
                    (z) => {
                        const val = R * 0.7 * Math.cos(k * z - phase + idx * 0.9);
                        return { ex: val * Math.sin(rad), ey: val * Math.cos(rad) };
                    },
                    'rgba(245, 158, 11, 0.72)',
                    'rgba(245, 158, 11, 0.22)',
                    w, h, cam1, 1.4, 14
                );
            });

            // Polariser P1 (Fixed 0°)
            drawOpticalElementDisk(ctx, zP1, R, 0, 'Polariser P1', '0°', '#e11d48', false, w, h, cam1);

            // Linearly Polarised Wave between P1 and P2
            drawCombWave3D(
                ctx, zP1, zP2,
                (z) => ({ ex: 0, ey: R * 0.88 * Math.cos(k * z - phase) }),
                '#e11d48',
                'rgba(225, 29, 72, 0.32)',
                w, h, cam1, 2.2, 9
            );

            // Analyser P2 (Rotatable angle alpha)
            drawOpticalElementDisk(ctx, zP2, R, alphaDeg, 'Analyser P2', `α = ${Math.round(alphaDeg)}°`, '#4f46e5', false, w, h, cam1);

            // Transmitted Wave after P2
            const radAlpha = alphaDeg * Math.PI / 180;
            const cosAlpha = Math.cos(radAlpha);
            const ampTrans = R * 0.88 * cosAlpha;

            drawCombWave3D(
                ctx, zP2, zEnd,
                (z) => {
                    const eMag = ampTrans * Math.cos(k * z - phase);
                    return {
                        ex: eMag * Math.sin(radAlpha),
                        ey: eMag * Math.cos(radAlpha)
                    };
                },
                '#4f46e5',
                'rgba(79, 70, 229, 0.30)',
                w, h, cam1, 2.3, 9
            );

            // Output Plane at zEnd
            drawReferencePlane(ctx, zEnd, R, w, h, cam1, 'Output', '', '#94a3b8', 'rgba(241, 245, 249, 0.6)');

            const pCenter = projectPoint(0, 0, zEnd, w, h, cam1);
            const axX = R * 0.88 * Math.sin(radAlpha);
            const axY = R * 0.88 * Math.cos(radAlpha);
            const pAxis1 = projectPoint(-axX, -axY, zEnd, w, h, cam1);
            const pAxis2 = projectPoint(axX, axY, zEnd, w, h, cam1);

            ctx.beginPath();
            ctx.setLineDash([3, 3]);
            ctx.moveTo(pAxis1.u, pAxis1.v);
            ctx.lineTo(pAxis2.u, pAxis2.v);
            ctx.strokeStyle = 'rgba(79, 70, 229, 0.5)';
            ctx.lineWidth = 1.3;
            ctx.stroke();
            ctx.setLineDash([]);

            const instMag = ampTrans * Math.cos(k * zEnd - phase);
            const pInstTip = projectPoint(instMag * Math.sin(radAlpha), instMag * Math.cos(radAlpha), zEnd, w, h, cam1);
            drawArrow2D(ctx, pCenter.u, pCenter.v, pInstTip.u, pInstTip.v, '#4f46e5', 2.6);
        }

        // =========================================================================
        // 5. RENDER PANEL 2: QUARTER-WAVE PLATE (WIDE SEPARATION TO ANALYSER P2)
        // =========================================================================
        function renderQWPWithSize(ctx, w, h) {
            // Extended coordinates so State Plane and Analyser P2 have a generous spatial gap
            const zStart = -430;
            const zQWP = -260;
            const zStatePlane = -30;   // State Plane near center-left
            const zP2 = 195;           // Analyser P2 placed far to the right (225 units gap!)
            const zEnd = 380;
            const R = 64;
            const k = 0.052;

            // Propagation axis z
            const pAxisStart = projectPoint(0, 0, zStart - 20, w, h, cam2);
            const pAxisEnd = projectPoint(0, 0, (showP2 ? zEnd : zStatePlane + 90) + 35, w, h, cam2);
            drawArrow2D(ctx, pAxisStart.u, pAxisStart.v, pAxisEnd.u, pAxisEnd.v, '#64748b', 1.3);
            ctx.fillStyle = '#475569';
            ctx.font = 'italic bold 12px "Times New Roman", serif';
            ctx.fillText('z', pAxisEnd.u + 10, pAxisEnd.v + 4);

            // Input Plane P1 (0°)
            drawReferencePlane(ctx, zStart, R * 0.92, w, h, cam2, 'Input (P1)', '0°', '#cbd5e1', 'rgba(248, 250, 252, 0.45)');

            // Linearly Polarised Input Wave (zStart -> zQWP)
            drawCombWave3D(
                ctx, zStart, zQWP,
                (z) => ({ ex: 0, ey: R * 0.88 * Math.cos(k * z - phase) }),
                '#e11d48',
                'rgba(225, 29, 72, 0.30)',
                w, h, cam2, 2.1, 10
            );

            // Quarter-Wave Plate at zQWP
            drawOpticalElementDisk(
                ctx, zQWP, R, thetaDeg,
                'QWP (λ/4)',
                `θ = ${Math.round(thetaDeg)}°`,
                '#2563eb', true, w, h, cam2
            );

            const thRad = thetaDeg * Math.PI / 180;
            const E0 = R * 0.88;
            const ampE = E0 * Math.cos(thRad);
            const ampO = -E0 * Math.sin(thRad);

            function evalQWPField(z) {
                const phi = k * (z - zQWP) - phase;
                const valE = ampE * Math.cos(phi);
                const valO = ampO * Math.sin(phi); // pi/2 phase retardation

                const e_ex = valE * Math.sin(thRad);
                const e_ey = valE * Math.cos(thRad);

                const o_ex = valO * Math.cos(thRad);
                const o_ey = -valO * Math.sin(thRad);

                return {
                    e_ex, e_ey,
                    o_ex, o_ey,
                    ex: e_ex + o_ex,
                    ey: e_ey + o_ey
                };
            }

            // Wave propagation from QWP (z = -260) through State Plane (z = -30) all the way to P2 (z = +195)
            const zWaveLimit = showP2 ? zP2 : zStatePlane + 60;

            if (showComponents) {
                // Fast axis wave Ee (Blue)
                drawCombWave3D(
                    ctx, zQWP, zWaveLimit,
                    (z) => {
                        const f = evalQWPField(z);
                        return { ex: f.e_ex, ey: f.e_ey };
                    },
                    '#2563eb',
                    'rgba(37, 99, 235, 0.20)',
                    w, h, cam2, 1.6, 11
                );

                // Slow axis wave Eo (Red)
                drawCombWave3D(
                    ctx, zQWP, zWaveLimit,
                    (z) => {
                        const f = evalQWPField(z);
                        return { ex: f.o_ex, ey: f.o_ey };
                    },
                    '#e11d48',
                    'rgba(225, 29, 72, 0.20)',
                    w, h, cam2, 1.6, 11
                );
            }

            if (showTotalE) {
                // Resultant 3D helical/elliptical wave E (Indigo)
                drawCombWave3D(
                    ctx, zQWP, zWaveLimit,
                    (z) => {
                        const f = evalQWPField(z);
                        return { ex: f.ex, ey: f.ey };
                    },
                    '#4f46e5',
                    'rgba(79, 70, 229, 0.34)',
                    w, h, cam2, 2.5, 9
                );
            }

            // State Plane at z = -30 showing 2D Polarization Ellipse / Circle / Line
            const thRound = Math.round(thetaDeg);
            const stateSub = (thRound === 0 || thRound === 90) ? 'Linear' : (thRound === 45 ? 'Circular' : 'Elliptical');
            drawReferencePlane(ctx, zStatePlane, R, w, h, cam2, 'State Plane', stateSub, '#94a3b8', 'rgba(241, 245, 249, 0.62)');

            ctx.beginPath();
            for (let s = 0; s <= 72; s++) {
                const pAng = (s / 72) * Math.PI * 2;
                const vE = ampE * Math.cos(pAng);
                const vO = ampO * Math.sin(pAng);
                const lx = vE * Math.sin(thRad) + vO * Math.cos(thRad);
                const ly = vE * Math.cos(thRad) - vO * Math.sin(thRad);
                const pt = projectPoint(lx, ly, zStatePlane, w, h, cam2);
                if (s === 0) ctx.moveTo(pt.u, pt.v);
                else ctx.lineTo(pt.u, pt.v);
            }
            ctx.strokeStyle = '#4f46e5';
            ctx.lineWidth = 2.2;
            ctx.stroke();

            const fState = evalQWPField(zStatePlane);
            const pStateCenter = projectPoint(0, 0, zStatePlane, w, h, cam2);
            const pStateTip = projectPoint(fState.ex, fState.ey, zStatePlane, w, h, cam2);
            drawArrow2D(ctx, pStateCenter.u, pStateCenter.v, pStateTip.u, pStateTip.v, '#4f46e5', 2.6);

            // Crossed Analyser P2 at z = +195 (Well-separated from State Plane at z = -30)
            if (showP2) {
                drawOpticalElementDisk(
                    ctx, zP2, R, 90,
                    'Analyser P2',
                    '90° (Crossed)',
                    '#059669', false, w, h, cam2
                );

                // Transmitted horizontal component after P2 (zP2 -> zEnd)
                drawCombWave3D(
                    ctx, zP2, zEnd,
                    (z) => {
                        const f = evalQWPField(z);
                        return { ex: f.ex, ey: 0 };
                    },
                    '#059669',
                    'rgba(5, 150, 105, 0.32)',
                    w, h, cam2, 2.3, 9
                );

                // Output Plane at zEnd
                drawReferencePlane(ctx, zEnd, R * 0.92, w, h, cam2, 'Output', '', '#94a3b8', 'rgba(241, 245, 249, 0.55)');
                const fEnd = evalQWPField(zEnd);
                const pEndCenter = projectPoint(0, 0, zEnd, w, h, cam2);
                const pEndTip = projectPoint(fEnd.ex, 0, zEnd, w, h, cam2);
                drawArrow2D(ctx, pEndCenter.u, pEndCenter.v, pEndTip.u, pEndTip.v, '#059669', 2.5);
            }
        }

        // =========================================================================
        // 6. INTERACTION (ORBIT DRAG & ZOOM) & ANIMATION LOOP
        // =========================================================================
        function bindCanvasInteractions(canvasId, camObj) {
            const canvas = document.getElementById(canvasId);
            let dragging = false;
            let lastX = 0, lastY = 0;

            canvas.addEventListener('pointerdown', (e) => {
                dragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                camObj.yaw = Math.max(-1.15, Math.min(-0.12, camObj.yaw + dx * 0.0045));
                camObj.pitch = Math.max(0.05, Math.min(0.65, camObj.pitch + dy * 0.0045));
            });

            canvas.addEventListener('pointerup', () => {
                dragging = false;
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY > 0 ? 0.95 : 1.05;
                camObj.zoom = Math.max(0.45, Math.min(1.05, camObj.zoom * factor));
            }, { passive: false });
        }

        function resizeCanvases() {
            const dpr = window.devicePixelRatio || 1;
            ['canvasMalus', 'canvasQWP'].forEach(id => {
                const c = document.getElementById(id);
                if (c && c.parentElement) {
                    const rect = c.parentElement.getBoundingClientRect();
                    c.width = rect.width * dpr;
                    c.height = rect.height * dpr;
                    const ctx = c.getContext('2d');
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    c.logicalWidth = rect.width;
                    c.logicalHeight = rect.height;
                }
            });
        }

        function animateLoop() {
            if (isPlaying) {
                phase += 0.052;
            }
            if (autoMalus) {
                updateMalusAlpha(alphaDeg + 0.6);
            }

            const c1 = document.getElementById('canvasMalus');
            if (c1 && c1.logicalWidth) {
                const ctx1 = c1.getContext('2d');
                ctx1.save();
                ctx1.setTransform(1, 0, 0, 1, 0, 0);
                ctx1.clearRect(0, 0, c1.width, c1.height);
                ctx1.restore();
                renderMalusWithSize(ctx1, c1.logicalWidth, c1.logicalHeight);
            }

            const c2 = document.getElementById('canvasQWP');
            if (c2 && c2.logicalWidth) {
                const ctx2 = c2.getContext('2d');
                ctx2.save();
                ctx2.setTransform(1, 0, 0, 1, 0, 0);
                ctx2.clearRect(0, 0, c2.width, c2.height);
                ctx2.restore();
                renderQWPWithSize(ctx2, c2.logicalWidth, c2.logicalHeight);
            }

            requestAnimationFrame(animateLoop);
        }

        window.onload = function () {
            resizeCanvases();
            window.addEventListener('resize', resizeCanvases);
            bindCanvasInteractions('canvasMalus', cam1);
            bindCanvasInteractions('canvasQWP', cam2);
            updateMalusAlpha(30);
            updateQWPTheta(45);
            animateLoop();
        };
    </script>

</body></html>
